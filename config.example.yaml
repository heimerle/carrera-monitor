# Example configuration for carrera-monitor.
# Copy to config.yaml and edit. All sections and fields are optional;
# missing fields fall back to the built-in defaults shown here.

bluetooth:
  # MAC address of the Carrera AppConnect adapter. If null, a BLE scan is
  # performed at startup. Ignored in --mock mode.
  mac_address: null
  scan_timeout_seconds: 10
  connect_timeout_seconds: 15
  reconnect_interval_seconds: 5
  max_reconnect_interval_seconds: 30
  reconnect_backoff_seconds: [1, 2, 5, 10, 20, 30]
  idle_timeout_seconds: 15
  idle_warning_seconds: 5
  stale_timeout_seconds: 10
  reconnect_on_stale: true
  allow_manual_connect: true
  allow_manual_disconnect: true
  prefer_scan_device_object: true
  # 0 disables periodic forced reconnect; liveness/watchdog remains primary.
  periodic_forced_reconnect_seconds: 0
  periodic_reconnect_only_when_not_running: true

logging:
  # Directory for JSONL event logs and the dashboard state snapshot.
  directory: ./logs
  jsonl_enabled: true
  # Companion CSV with one row per lap event.
  csv_laps_enabled: true
  # When true, every translated frame also emits a companion `raw` event
  # carrying the original upstream frame in `raw_data` (FR-013). Off by
  # default to keep JSONL files lean. Can be overridden with --debug-raw.
  debug_raw_enabled: false

dashboard:
  enabled: true
  port: 8501
  # Refresh interval in milliseconds (clamped to 500–1000).
  refresh_interval_ms: 200

cars:
  # Number of simulated cars in --mock mode (1–6). Hardware mode is driven
  # by what the adapter reports.
  count: 6

database:
  # SQLAlchemy URL for the race-management SQLite database. Created on first
  # run; the parent directory (default ./data) is auto-created.
  url: "sqlite:///./data/carrera_dashboard.sqlite3"
  # Echo all SQL statements to stderr (very verbose; debug only).
  echo: false

race_management:
  # When true, every translated TelemetryEvent during an active race is
  # persisted into the race_events table (in addition to lap rows). When
  # false, only lap events are persisted.
  persist_all_events: true
  # When false (default), races in status ∈ {running, paused, finished,
  # cancelled} cannot be edited via the UI. Set to true to override.
  allow_edit_running_race: false
  # Status assigned to newly created (and repeated) races.
  default_race_status_after_create: "draft"
  # On startup, if a race was left in status='running' (e.g. crash),
  # re-attach to it by default to preserve continuity.
  recover_running_race: true
