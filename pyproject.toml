[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carrera-monitor"
version = "0.1.0"
description = "Modular telemetry and live dashboard for Carrera DIGITAL 124/132 via AppConnect, with full mock mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Weinheimer" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "streamlit>=1.30",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
live = ["carreralib"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
carrera-monitor = "src.main:cli_entry"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Blocking file I/O is intentional in storage (batched JSONL/CSV writers
# hold long-lived handles; switching to async would add overhead without
# benefit for the small, infrequent flushes).
"src/storage.py" = ["ASYNC230", "SIM115"]
# pathlib.Path is used during one-shot startup directory creation, which
# is acceptable in an async function.
"src/main.py" = ["ASYNC240"]
# Tests read/write log files synchronously for assertions.
"tests/test_storage.py" = ["ASYNC230"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["carreralib", "carreralib.*", "streamlit", "streamlit.*", "streamlit_autorefresh", "streamlit_autorefresh.*"]
ignore_missing_imports = true
